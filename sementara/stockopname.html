<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pisang Ijo Omah - Stock Opname</title>
    <!-- Google Fonts: Inter, Poppins, Quicksand -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Poppins:wght@500;600;700&family=Quicksand:wght@500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="stockopname.css">
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            green: '#1DDB5C',
                            darkGreen: '#13903D',
                            activeBg: '#97F2B5',
                            lightBg: 'rgba(29, 219, 92, 0.25)',
                            badgeRed: '#F44336'
                        },
                        darkText: '#1F374C'
                    },
                    fontFamily: {
                        inter: ['Inter', 'sans-serif'],
                        poppins: ['Poppins', 'sans-serif'],
                        quicksand: ['Quicksand', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <!-- External CSS -->
    <link rel="stylesheet" href="css/stock.css">
</head>
<body class="h-screen flex overflow-hidden bg-white">

    <!-- Mobile Backdrop -->
    <div id="sidebar-backdrop" onclick="toggleSidebar()" class="fixed inset-0 bg-black/40 z-40 lg:hidden hidden"></div>

    <!-- SIDEBAR -->
    <aside id="sidebar" class="fixed lg:static inset-y-0 left-0 w-[280px] bg-white border-r border-slate-100/80 z-50 flex flex-col justify-between p-6 transition-transform duration-300 -translate-x-full lg:translate-x-0 shadow-lg lg:shadow-[0_0_35px_rgba(0,0,0,0.08)]">
        
        <div class="space-y-6">
            <!-- Brand Header -->
            <div class="flex items-center gap-4 px-1 py-2">
                <div class="w-[45px] h-[45px] bg-[#13903D] rounded-none shrink-0 flex items-center justify-center">
                    <svg class="w-6 h-6 text-white" fill="currentColor" viewBox="0 0 24 24">
                        <path d="M12 2L4 7v10l8 5 8-5V7l-8-5zm0 2.2L18 8l-6 3.8L6 8l6-3.8z"/>
                    </svg>
                </div>
                <h1 class="font-inter font-semibold text-[26px] leading-[34px] text-[#1DDB5C]">
                    Pisang Ijo<br/>Omah
                </h1>
            </div>

            <!-- Navigation Links -->
            <nav class="space-y-1">
                <!-- Beranda -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 00-1-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"/></svg>
                    <span>Beranda</span>
                </a>

                <!-- Menu -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6.253v13m0-13C10.832 5.477 9.246 5 7.5 5S4.168 5.477 3 6.253v13C4.168 18.477 5.754 18 7.5 18s3.332.477 4.5 1.253m0-13C13.168 5.477 14.754 5 16.5 5c1.747 0 3.332.477 4.5 1.253v13C19.832 18.477 18.247 18 16.5 18c-1.746 0-3.332.477-4.5 1.253"/></svg>
                    <span>Menu</span>
                </a>

                <!-- Transaksi -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 7h6m0 10v-3m-3 3h.01M9 17h.01M9 14h.01M12 14h.01M15 11h.01M12 11h.01M9 11h.01M7 21h10a2 2 0 002-2V5a2 2 0 00-2-2H7a2 2 0 00-2 2v14a2 2 0 002 2z"/></svg>
                    <span>Transaksi</span>
                </a>

                <!-- Manajemen Barang -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/></svg>
                    <span>Manajemen Barang</span>
                </a>

                <!-- Stock Opname (Active Item) -->
                <a href="stockopname.html" class="nav-item active flex items-center gap-3 px-4 py-2.5">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2m-6 9l2 2 4-4"/></svg>
                    <span>Stock Opname</span>
                </a>

                <!-- Manajemen Pengguna -->
                <a href="manajemenpengguna.html" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"/></svg>
                    <span>Manajemen Pengguna</span>
                </a>

                <!-- Laporan Keuangan -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 17v-2m3 2v-4m3 4v-6m2 10H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/></svg>
                    <span>Laporan Keuangan</span>
                </a>

                <!-- Riwayat Aktifitas -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/></svg>
                    <span>Riwayat Aktifitas</span>
                </a>

                <!-- Pengaturan -->
                <a href="#" class="nav-item flex items-center gap-3 px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"/><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"/></svg>
                    <span>Pengaturan</span>
                </a>

                <!-- Notifikasi with Badge 2 -->
                <a href="notifikasi.html" class="nav-item flex items-center justify-between px-4 py-2.5 rounded-lg text-[#1F374C]">
                    <div class="flex items-center gap-3">
                        <svg class="w-5 h-5 text-[#5D7285]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/></svg>
                        <span>Notifikasi</span>
                    </div>
                    <span class="w-[22px] h-[22px] bg-[#F44336] text-white font-poppins text-xs font-medium rounded-[4px] flex items-center justify-center">2</span>
                </a>
            </nav>
        </div>

        <!-- Log out Button -->
        <div class="mt-8">
            <button onclick="handleLogout()" class="w-full flex items-center justify-center gap-2.5 px-4 py-3 bg-[#1DDB5C] hover:bg-[#19cc54] text-white rounded-[10px] font-inter font-medium text-[15px] transition-colors shadow-sm">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"/></svg>
                <span>Log out</span>
            </button>
        </div>
    </aside>

    <!-- MAIN AREA -->
    <div class="flex-1 flex flex-col min-w-0 overflow-y-auto">
        
        <!-- HEADER BAR -->
        <header class="bg-white border-b border-[#E0E0E0] px-8 py-5 flex items-center justify-between">
            <div class="flex items-center gap-4">
                <button onclick="toggleSidebar()" class="lg:hidden text-slate-600 p-1.5 rounded-lg hover:bg-slate-100">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/></svg>
                </button>
                <h2 class="font-poppins font-medium text-[24px] leading-8 text-black">Manajemen Barang</h2>
            </div>
            <!-- Search bar -->
            <div class="relative w-64 hidden sm:block">
                <input type="text" id="searchInput" oninput="filterTable()" placeholder="Cari item..." class="w-full pl-9 pr-4 py-2 border border-slate-300 rounded-xl text-sm font-quicksand focus:outline-none focus:border-[#1DDB5C]">
                <svg class="w-4 h-4 text-slate-400 absolute left-3 top-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/></svg>
            </div>
        </header>

        <!-- MAIN CONTENT CANVAS -->
        <main class="flex-1 p-6 md:p-12 max-w-[1100px] w-full mx-auto space-y-8">
            
            <!-- SECTION 1: TAB BUTTONS (Daftar Jenis & supplier) -->
            <div class="flex items-center gap-6">
                <button id="tab-jenis" onclick="switchTab('jenis')" class="btn-daftar-jenis active px-8 py-3.5 rounded-[15px] font-poppins font-bold text-[24px] leading-none transition-all">
                    Daftar Jenis
                </button>

                <button id="tab-supplier" onclick="switchTab('supplier')" class="btn-supplier px-8 py-3.5 rounded-[15px] font-poppins font-bold text-[24px] leading-none transition-all">
                    Pemasuk
                </button>
            </div>

            <!-- SECTION 2: ADD BUTTON -->
            <div>
                <button onclick="openAddModal()" class="btn-tambah-stok flex items-center gap-3 px-6 py-3 rounded-[15px] text-white font-poppins font-bold text-[24px]">
                    <svg class="w-7 h-7" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M12 4v16m8-8H4"/></svg>
                    Tambah Stok Barang
                </button>
            </div>

            <!-- SECTION 3: TABLE -->
            <div class="overflow-x-auto">
                <table class="w-full font-poppins text-[24px]">
                    <thead>
                        <tr class="table-row-divider">
                            <th id="thNama" class="text-left pb-5 pr-6 font-medium text-black">Nama Barang</th>
                            <th class="text-left pb-5 px-6 font-medium text-black">stok<br>saat ini</th>
                            <th class="text-left pb-5 px-6 font-medium text-black">stok<br>minimum</th>
                            <th class="text-center pb-5 pl-6 font-medium text-black">Aksi</th>
                        </tr>
                    </thead>
                    <tbody id="inventoryTableBody">
                        <!-- Populated by JS -->
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- ITEM MODAL -->
    <div id="itemModal" class="fixed inset-0 z-50 hidden flex items-center justify-center bg-black/40">
        <div class="bg-white rounded-2xl shadow-2xl w-full max-w-md mx-4 p-8 space-y-6 font-poppins">
            <div class="flex items-center justify-between">
                <h3 id="modalTitle" class="font-bold text-[22px] text-black">Tambah Stok Barang</h3>
                <button onclick="closeModal()" class="text-slate-400 hover:text-slate-700 transition-colors">
                    <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <form id="itemForm" onsubmit="handleFormSubmit(event)" class="space-y-4">
                <input type="hidden" id="editingItemId">
                <div class="space-y-1.5">
                    <label id="labelNama" class="block text-slate-600 text-[15px] font-medium">Nama Barang</label>
                    <input type="text" id="itemName" required placeholder="Contoh: Pisang Ijo" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-[15px] focus:outline-none focus:border-[#1DDB5C]">
                </div>
                <div class="grid grid-cols-2 gap-4">
                    <div class="space-y-1.5">
                        <label class="block text-slate-600 text-[15px] font-medium">Stok Saat Ini</label>
                        <input type="number" id="itemQty" required min="0" placeholder="0" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-[15px] focus:outline-none focus:border-[#1DDB5C]">
                    </div>
                    <div class="space-y-1.5">
                        <label class="block text-slate-600 text-[15px] font-medium">Stok Minimum</label>
                        <input type="number" id="itemMinQty" required min="0" placeholder="0" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-[15px] focus:outline-none focus:border-[#1DDB5C]">
                    </div>
                </div>
                <div class="space-y-1.5">
                    <label class="block text-slate-600 text-[15px] font-medium">Satuan</label>
                    <select id="itemUnit" class="w-full px-4 py-3 border border-slate-300 rounded-xl text-[15px] focus:outline-none focus:border-[#1DDB5C]">
                        <option value="Kg">Kg</option>
                        <option value="L">L</option>
                        <option value="Pcs">Pcs</option>
                        <option value="Gr">Gr</option>
                        <option value="ml">ml</option>
                    </select>
                </div>

                <div class="pt-4 flex items-center justify-end gap-3">
                    <button type="button" onclick="closeModal()" class="px-5 py-2.5 border border-slate-300 rounded-xl font-poppins font-semibold text-slate-600 hover:bg-slate-100">
                        Batal
                    </button>
                    <button type="submit" class="px-6 py-2.5 bg-[#1DDB5C] hover:bg-[#19cc54] text-white font-poppins font-bold rounded-xl shadow-md">
                        Simpan
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- ACTION DROPDOWN POPOVER MENU -->
    <div id="actionPopover" class="fixed hidden z-50 bg-white border border-slate-200 rounded-xl shadow-xl w-48 py-2 font-poppins text-sm">
        <button onclick="triggerEdit()" class="w-full text-left px-4 py-2 hover:bg-emerald-50 text-slate-700 font-medium flex items-center gap-2">
            <svg class="w-4 h-4 text-[#1DDB5C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"/></svg>
            Edit Stok
        </button>
        <button onclick="triggerRestock()" class="w-full text-left px-4 py-2 hover:bg-emerald-50 text-slate-700 font-medium flex items-center gap-2">
            <svg class="w-4 h-4 text-[#1DDB5C]" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"/></svg>
            Tambah Qty
        </button>
        <div class="border-t border-slate-100 my-1"></div>
        <button onclick="triggerDelete()" class="w-full text-left px-4 py-2 hover:bg-red-50 text-red-600 font-medium flex items-center gap-2">
            <svg class="w-4 h-4 text-red-500" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/></svg>
            Hapus Item
        </button>
    </div>

    <!-- TOAST MESSAGES -->
    <div id="toast" class="fixed bottom-6 right-6 z-50 hidden px-5 py-3 rounded-xl bg-slate-900 text-white font-poppins text-sm shadow-xl flex items-center gap-3">
        <span id="toast-text">Pesan</span>
    </div>

    <script src="stockopname.js"></script>
</body>
</html>
