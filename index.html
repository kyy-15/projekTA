<!DOCTYPE html>
<html lang="id">

<head>
    <meta charset="UTF-8">
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; font-src 'self';">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Es Pisang Ijo Oma - Login</title>
    <link rel="stylesheet" href="fonts/all.min.css">
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <div class="container">
        <div class="brand-section">
            <div class="logo-wrapper">
                <img src="logo-oma.png" alt="Es Pisang Ijo Oma Logo" class="logo-img">
            </div>
            <h1 class="brand-title">ES PISANG IJO OMA</h1>
        </div>

        <div class="login-section">
            <div class="login-card">
                <h2>Sign in</h2>
                <form id="loginForm">
                    <!-- Input Username -->
                    <div class="input-group">
                        <label for="username">Username</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-user icon"></i>
                            <input type="text" id="username" placeholder="Username..." required>
                        </div>
                    </div>

                    <!-- Input Password -->
                    <div class="input-group">
                        <label for="password">Password</label>
                        <div class="input-wrapper">
                            <i class="fa-solid fa-lock icon"></i>
                            <input type="password" id="password" placeholder="Password..." required>
                            <i class="fa-solid fa-eye toggle-icon" id="togglePassword"></i>
                        </div>
                    </div>

                    <!-- Tombol Sign In -->
                    <button type="submit" class="btn-submit">Sign In</button>
                </form>
            </div>
        </div>
    </div>

    <script src="js/renderer.js"></script>
</body>

</html>
