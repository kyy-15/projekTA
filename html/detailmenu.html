<!DOCTYPE html>
<html lang="id">

<head>

    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Es Pisang Ijo Oma - detail menu</title>
        <!-- <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;"> -->
        <link rel="stylesheet" href="../css/sidebar.css">
        <link rel="stylesheet" href="../fonts/all.min.css">
        <link rel="stylesheet" href="../css/detailmenu.css">
    </head>
</head>

<body class="beranda-body">
    <div class="dashboard-wrapper">
        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <span class="sub-brand">Es Pisang Ijo Oma</span>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-info">
                            <span class="user-name">Heri Sugeng</span>
                            <span class="user-role">owner</span>
                        </div>
                        <div class="user-avatar">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                    </div>
                </div>
            </header>

            <div class="container">
                
                <div class="breadcrumb-nav">
                    <a href=menu.html>Menu &gt; Detail Menu</a>
                </div>
                <!-- CARD ATAS: VIEW & EDIT INFORMASI UTAMA -->
                <section class="menu-detail-container">
                    <div class="image-upload-section">
                        <div class="image-placeholder" id="detail-img-preview"></div>
                        <input type="file" id="detail-input-foto" accept="image/*" class="upload-foto">
                        <button type="button" class="btn-primary btn-full-width" id="btn-ubah-foto">Ubah Foto</button>
                    </div>

                    <div class="form-input">
                        <h1 class="menu-title-live" id="detail-txt-title">Es Pisang Ijo Original</h1>

                        <div class="form-group">
                            <label>Nama Menu</label>
                            <input type="text"  class="form-control" id="detail-input-nama" value="Es Pisang Ijo Original">
                        </div>

                        <div class="form-group">
                            <label>Kategori</label>
                            <select  class="form-control" id="detail-input-kategori">
                                <option value="Es pisang ijo">Es pisang ijo</option>
                                <option value="Premium">Premium</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Varian</label>
                            <select  class="form-control" id="detail-select-varian">
                                <option value="dine-in">makan di tempat</option>
                                <option value="takeaway">dibawa pulang</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Deskripsi</label>
                            <textarea  class="form-control" id="detail-input-deskripsi"></textarea>
                        </div>
                    </div>
                </section>

                <!-- GRID BAWAH: TABEL BAHAN BAKU & MANAJEMEN HARGA -->
                <div class="management-section">

                    <!-- BLOK KIRI: TABEL RESEP BAHAN BAKU -->
                    <div class="ingredients-table-container">
                        <table class="table-resep green-header-table">
                            <thead>
                                <tr>
                                    <th>Bahan Baku</th>
                                    <th>Jumlah</th>
                                    <th>Modal</th>
                                    <th>Aksi</th>
                                </tr>
                            </thead>
                            <tbody id="detail-tbody-resep">
                                <!-- Data Bahan Baku Dimuat Disini -->
                            </tbody>
                        </table>
                        <button type="button" class="btn-tambah-baku-secondary1 green-style-btn"
                            id="btn-detail-tambah-bahan">📋 Tambah Bahan Baku</button>
                    </div>

                    <!-- BLOK KANAN: MANAJEMEN HARGA -->
                    <div class="price-management-card">
                        <h3 class="panel-section-title">Manajemen Harga</h3>

                        <div class="price-row">
                            <div class="form-group">
                                <label>HPP/Modal</label>
                                <div class="input-prefix-group">
                                    <span class="prefix">Rp</span>
                                    <input type="text" class="form-control" id="detail-input-hpp" readonly value="0">
                                </div>
                            </div>

                            <div class="form-group">
                                <label>Harga Jual</label>
                                <div class="input-prefix-group">
                                    <span class="prefix">Rp</span>
                                    <input type="number" class="form-control" id="detail-input-harga-jual" value="0">
                                </div>
                            </div>
                        </div>

                        <div class="margin-result-section">
                            <label>Margin Laba</label>
                            <div class="percentage-display" id="detail-txt-margin">0 %</div>
                        </div>

                        <div class="action-buttons-row">
                            <button type="button" class="btn-danger" id="btn-hapus-menu">Hapus Menu</button>
                            <button type="button" class="btn-primary" id="btn-ubah-detail-menu">Ubah Detail Menu</button>
                        </div>
                    </div>

                </div>
            </div>
        </main>
    </div>

    <!-- POP-UP MODAL: SELEKSI TAMBAH BAHAN SAAT EDIT -->
    <div class="modal-overlay" id="detail-modal-bahan">
        <div class="modal-box">
            <h3>Tambah Bahan Baku Baru</h3>

            <div class="form-group">
                <label>Pilih Bahan Baku</label>
                <div class="select-row">
                    <select id="modal-select-barang"></select>
                    <span class="stok-info" id="modal-txt-stok">Stok: -</span>
                </div>
            </div>

            <div class="form-group">
                <label>Jumlah Takaran</label>
                <div class="input-unit-row">
                    <input type="number" step="1" id="modal-input-takaran" value="1">
                    <span id="modal-txt-satuan">-</span>
                </div>
            </div>

            <div class="modal-footer">
                <button class="btn-danger" id="btn-modal-tutup">Batal</button>
                <button class="btn-primary" id="btn-modal-save-item">Simpan
                    Bahan</button>
            </div>
        </div>
    </div>
    <script src="../js/detail-menu.js"></script>
    <script src="../js/sidebar.js"></script>
</body>

</html>
