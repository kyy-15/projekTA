<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu Produk - Pisang Ijo Omah</title>
    <meta http-equiv="Content-Security-Policy"
        content="default-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:;">
    <link rel="stylesheet" href="../css/sidebar.css">
    <link rel="stylesheet" href="../css/menu-style.css">
    <link rel="stylesheet" href="../fonts/all.min.css">
</head>

<body class="beranda-body">

    <div class="dashboard-wrapper">

        <div id="sidebar-container"></div>

        <main class="main-content">
            <header class="content-header">
                <div class="header-left">
                    <span class="sub-brand">Es Pisang Ijo Oma</span>
                </div>
                <div class="header-right">
                    <div class="user-profile">
                        <div class="user-info">
                            <span class="user-name">Heri Sugeng</span>
                            <span class="user-role">owner</span>
                        </div>
                        <div class="user-avatar">
                            <i class="fa-solid fa-user-tie"></i>
                        </div>
                    </div>
                </div>
            </header>

            <div class="container">
                <div class="menu-section-header">
                    <h2 class="menu-title-text">Menu Produk</h2>
                    <span class="welcome-date">24 Oktober 2026</span>
                </div>
                <div class="menu-action-bar">
                    <div class="menu-filter-zone">
                        <div class="menu-search-box">
                            <i class="fa-solid fa-magnifying-glass search-icon-inside"></i>
                            <input type="text" id="searchProduct" placeholder="Search...">
                        </div>
                        <div class="menu-category-group" id="category">
                        </div>
                    </div>

                    <div class="menu-btn-actions">
                        <button class="menu-btn-add" id="categoryBtn"><i class="fa-solid fa-plus"></i> Tambah Kategori</button>
                        <a href="tambah-menu.html"><button class="menu-btn-add"><i class="fa-solid fa-plus"></i> Tambah Menu </button></a>
                    </div>
                </div>

                <div class="menu-products-grid" id="list-menu"></div>
            </div>
        </main>
    </div>
    <div class="popup-kategori" id="popup-kategori">
        <input type="text" id="categoryInput" placeholder="Nama kategori baru...">
        <button id="addBtn">Tambah Kategori</button>
    </div>

    <script src="../js/sidebar.js"></script>
    <script src="../js/menu-script.js"></script>

</body>

</html>
