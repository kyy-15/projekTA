<!DOCTYPE html>
<html lang="id">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kasir - Transaksi</title>
  <link rel="stylesheet" href="../css/app-theme.css">
  <link rel="stylesheet" href="../css/sidebar.css">
  <link rel="stylesheet" href="../fonts/all.min.css">
  <link rel="stylesheet" href="../css/transaksi.css">
  <style>
    body { overflow: hidden; }
    .main-content { margin-left: 260px; margin-right: 380px; height: 100vh; overflow: hidden; padding: 24px 28px; }
    .pos-layout { display: block; height: calc(100vh - 115px); overflow-y: auto; padding-right: 4px; }
    .cart-card { position: fixed; z-index: 110; right: 0; top: 0; width: 380px; height: 100vh; border: 0; border-left: 1px solid var(--stroke); border-radius: 0; padding: 24px; display: flex; flex-direction: column; box-shadow: -4px 0 18px rgba(0,0,0,.06); }
    .cart-items { flex: 1; min-height: 100px; max-height: none; overflow-y: auto; }
    .product-placeholder { height: 105px; display: grid; place-items: center; border-radius: 8px; background: #e8f8ed; color: var(--primary); font-size: 28px; }
    .cash-form { display: none; margin-top: 8px; }
    .cash-form.visible { display: block; }
    .cash-warning { color: #c0392b; font-size: 12px; min-height: 18px; }
    @media (max-width: 900px) { body { overflow: auto; } .main-content { margin-right: 0; height: auto; overflow: visible; } .cart-card { position: relative; width: auto; height: auto; } }
   .pos-layout {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 360px;
      gap: 22px
    }

    .pos-toolbar {
      display: flex;
      gap: 12px;
      align-items: center;
      margin-bottom: 18px
    }

    .pos-toolbar input {
      flex: 1;
      padding: 12px;
      border: 1px solid var(--stroke);
      border-radius: 9px
    }

    .categories {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 18px
    }

    .category-btn,
    .pay-btn {
      border: 1px solid var(--stroke);
      background: #fff;
      border-radius: 8px;
      padding: 9px 14px;
      cursor: pointer
    }

    .category-btn.active,
    .pay-btn.active {
      background: var(--primary);
      color: #fff;
      border-color: var(--primary)
    }

    .product-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(155px, 1fr));
      gap: 14px
    }

    .product-card {
      background: #fff;
      border: 1px solid var(--stroke);
      border-radius: 12px;
      padding: 12px;
      cursor: pointer
    }

    .product-card:hover {
      border-color: var(--primary);
      box-shadow: var(--shadow)
    }

    .product-card img {
      width: 100%;
      height: 105px;
      object-fit: cover;
      border-radius: 8px;
      background: #e8f8ed
    }

    .product-card h3 {
      font-size: 14px;
      margin: 10px 0 6px;
      text-transform: capitalize
    }

    .product-card p {
      margin: 0;
      color: var(--primary-dark);
      font-weight: 600
    }

    .cart-card {
      background: #fff;
      border: 1px solid var(--stroke);
      border-radius: 14px;
      padding: 18px;
      position: sticky;
      top: 20px
    }

    .cart-card h2 {
      margin-top: 0
    }

    .cart-items {
      max-height: 300px;
      overflow: auto
    }

    .cart-item {
      border-bottom: 1px solid #edf2f7;
      padding: 10px 0
    }

    .cart-line {
      display: flex;
      justify-content: space-between;
      gap: 8px
    }

    .qty button,
    .delete-btn {
      border: 0;
      background: #e8f8ed;
      color: #16803c;
      border-radius: 5px;
      cursor: pointer
    }

    .qty {
      display: flex;
      gap: 7px;
      align-items: center;
      margin-top: 7px
    }

    .delete-btn {
      background: #fff0f0;
      color: #d33
    }

    .cart-card input {
      width: 100%;
      padding: 10px;
      margin: 6px 0;
      border: 1px solid var(--stroke);
      border-radius: 7px
    }

    .totals {
      border-top: 1px solid var(--stroke);
      margin-top: 12px;
      padding-top: 8px
    }

    .total-row {
      display: flex;
      justify-content: space-between;
      padding: 5px 0
    }

    .grand {
      font-size: 18px;
      font-weight: 700
    }

    .payment-buttons {
      display: flex;
      gap: 6px;
      margin: 8px 0 14px
    }

    .pay-btn {
      flex: 1;
      padding: 8px 4px
    }

    .pay-btn.active {
      background: var(--primary)
    }

    #payButton {
      width: 100%;
      padding: 13px;
      border: 0;
      border-radius: 8px;
      background: var(--primary);
      color: #fff;
      font-weight: 700;
      cursor: pointer
    }

    @media(max-width:900px) {
      .pos-layout {
        grid-template-columns: 1fr
      }

      .cart-card {
        position: static
      }
    }
  </style>
</head>

<body>
  <div class="page">
    <div id="sidebar-container"></div>
    <main class="main-content">
      <header class="page-header">
        <div>
          <h1><i class="fa-solid fa-cash-register"></i> Transaksi</h1>
          <p>Input pesanan pelanggan</p>
        </div><span id="dateText"></span>
      </header>
      <div class="pos-layout">
        <section>
          <div class="pos-toolbar"><input id="searchInput" type="search" placeholder="Search..." aria-label="Cari menu">
          </div>
          <div id="categories" class="categories"></div>
          <div id="productGrid" class="product-grid"></div>
        </section>
        <aside class="cart-card">
          <h2><i class="fa-solid fa-cart-shopping"></i> Keranjang Belanja</h2>
          <div id="cartItems" class="cart-items">
            <p>Keranjang masih kosong.</p>
          </div><input id="customerName" placeholder="Nama Pelanggan"><input id="orderNote"
            placeholder="Tambahan (catatan pesanan)">
          <div class="totals">
            <div class="total-row"><span>Subtotal</span><strong id="subtotal">Rp 0</strong></div>
            <div class="total-row"><span>Pajak (10%)</span><strong id="tax">Rp 0</strong></div>
            <div class="total-row"><span>Biaya Admin</span><strong id="adminFee">Rp 0</strong></div>
            <div class="total-row grand"><span>Grand Total</span><strong id="grandTotal">Rp 0</strong></div>
          </div>
          <p>Metode Pembayaran</p>
          <div id="paymentMethods" class="payment-buttons"><button class="pay-btn"
              data-method="QRIS">QRIS</button><button class="pay-btn" data-method="Transfer">Transfer</button><button
              class="pay-btn" data-method="Tunai">Tunai</button></div>
          <div id="cashForm" class="cash-form"><label for="cashReceived">Uang Tunai Pelanggan</label><input id="cashReceived" type="number" min="0" step="1000" placeholder="Masukkan nominal uang"><div id="changeAmount">Kembalian: Rp 0</div><div id="cashWarning" class="cash-warning" role="alert"></div></div>
          <button id="payButton">Bayar</button>
        </aside>
      </div>
    </main>
  </div>
  <script src="../js/sidebar.js"></script>
  <script src="../js/transaksi.js"></script>
</body>

</html>
